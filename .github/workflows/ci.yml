name: build-and-verify

# 只做校验，不写回仓库 —— 日更由本机定时任务负责（fetch_data.py → build_report.py → push）。
# 这里再插一个自动 commit 的 job 会和它抢 main（两个写入者互踩），得不偿失。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 先确认仓库里的 data/ 确实等于 manifest 记录的上游快照（没被手改过）
      - name: 校验 data/ 与 source_manifest.json 哈希一致
        run: >-
          python -c "import hashlib,json,os,sys;
          m=json.load(open('data/source_manifest.json',encoding='utf-8'));
          bad=[f for f,x in m['files'].items() if hashlib.sha256(open(os.path.join('data',f),'rb').read()).hexdigest()!=x['sha256']];
          print('上游快照哈希全部一致' if not bad else '不一致: '+str(bad));
          sys.exit(1 if bad else 0)"

      - name: 构建报告（日期钉在当天，保证可比）
        run: |
          export ACPC_DATA_DATE=$(TZ=Asia/Shanghai date +%F)
          echo "构建日期 $ACPC_DATA_DATE"
          python build_report.py

      - name: 核验产物（含「前端现算 CSV 与磁盘 CSV 逐字节一致」这条回归）
        run: python tools/verify_output.py

      # 单日快照时，上一步会自动跳过「逐日还原比对」（没有可比的历史日），
      # 所以七天回看的多日分支必须由这个夹具补上 —— 它在临时目录里合成 5 天快照。
      - name: 七天回看多日窗口测试
        run: python tools/test_history.py

      - name: 归档脚本演练（确认可用，不实际移动文件）
        run: python tools/archive_outputs.py --dry-run

      # B 项：data/_sanitized/ 是派生副本，必须与 data/ 保持同步。
      # 该脚本自带三重自检 —— 净化后推广痕迹须为 0、两份数据各构建一次、产物逐字节一致。
      # 后者同时证明了「推广字段从未参与输出」。
      - name: 净化快照自检 + 与 data/ 同步性
        run: |
          python tools/make_sanitized.py
          if ! git diff --quiet -- data/_sanitized; then
            echo "::error::data/_sanitized 与 data/ 已不同步，请在本机重跑 tools/make_sanitized.py 并提交"
            git diff --stat -- data/_sanitized
            exit 1
          fi
          echo "净化快照与 data/ 同步 ✓"

      # 链接体检：逐条请求官方页。外部站点会抽风（403/429/超时都可能），
      # 所以只作为提示项，不阻断 CI —— 真正需要人看的是 404/410。
      - name: 官方页链接体检（非阻断）
        continue-on-error: true
        run: python tools/check_links.py --quiet
