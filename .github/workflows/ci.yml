name: build-and-verify

# 只做校验，不写回仓库 —— 日更由本机定时任务负责（fetch_data.py → build_report.py → push）。
# 这里再插一个自动 commit 的 job 会和它抢 main（两个写入者互踩），得不偿失。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 先确认仓库里的 data/ 确实等于 manifest 记录的上游快照（没被手改过）
      - name: 校验 data/ 与 source_manifest.json 哈希一致
        run: >-
          python -c "import hashlib,json,os,sys;
          m=json.load(open('data/source_manifest.json',encoding='utf-8'));
          bad=[f for f,x in m['files'].items() if hashlib.sha256(open(os.path.join('data',f),'rb').read()).hexdigest()!=x['sha256']];
          print('上游快照哈希全部一致' if not bad else '不一致: '+str(bad));
          sys.exit(1 if bad else 0)"

      - name: 构建报告（日期钉在当天，保证可比）
        run: |
          export ACPC_DATA_DATE=$(TZ=Asia/Shanghai date +%F)
          echo "构建日期 $ACPC_DATA_DATE"
          python build_report.py

      # B 项：净化副本改为【按需生成】，不再入库（S2）。
      # 为什么不再 version 化：仅 plan-models.json 一个文件就是 623,875 字节（约 610 KB），
      # 两份就是 1.2 MB，而它 100% 可由 data/ 重算出来 —— 提交派生文件等于把仓库当缓存用，
      # 还会多出一条必须维护的「副本与正本是否同步」检查（不同步就红，纯属自找的腐烂点）。
      # 现在每次 CI 现场生成并跑自检，自检的三重断言一条没少：
      #   ① 净化后推广痕迹须为 0；② 用 data/ 与净化副本各构建一次；③ 两次产物逐字节一致
      #（第 ③ 条就是「推广字段从未参与输出」的机器证明）。
      # 注意必须排在核验之前 —— 核验的第 15 节要抽检生成结果，放后面就永远抽检不到。
      - name: 净化副本生成 + 自检（B 项）
        run: python tools/make_sanitized.py

      - name: 核验产物（含「前端现算 CSV 与磁盘 CSV 逐字节一致」这条回归）
        run: python tools/verify_output.py

      # 单日快照时，上一步会自动跳过「逐日还原比对」（没有可比的历史日），
      # 所以七天回看的多日分支必须由这个夹具补上 —— 它在临时目录里合成 5 天快照。
      - name: 七天回看多日窗口测试
        run: python tools/test_history.py

      - name: 归档脚本演练（确认可用，不实际移动文件）
        run: python tools/archive_outputs.py --dry-run

      # 需要一份可再分发的干净数据时，从构建产物里取（不依赖把副本提交进仓库）
      - name: 上传净化副本（供下载再分发）
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-data
          path: |
            data/_sanitized/*.json
            data/_sanitized/_manifest.json
          if-no-files-found: error
          retention-days: 14

      # 链接体检：逐条请求官方页。外部站点会抽风（403/429/超时都可能），
      # 所以只作为提示项，不阻断 CI —— 真正需要人看的是 404/410。
      - name: 官方页链接体检（非阻断）
        continue-on-error: true
        run: python tools/check_links.py --quiet
